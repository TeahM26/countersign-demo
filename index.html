<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countersign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&display=swap">
<style>
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --line:#E4E6EC; --line-2:#D4D7DF;
  --ink:#17151F; --ink-2:#4B4A57; --ink-3:#7D7B8A;
  --iris:#4F2FE6; --iris-2:#3E1FD0; --iris-tint:#EFEBFE; --iris-line:#D8D0FB;
  --ok:#0F7A55; --ok-tint:#E5F3ED; --hold:#9C5A00; --hold-tint:#FBF0DF; --deny:#B3261E; --deny-tint:#FBEAE8;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.45,.64,1);
  --lift:0 1px 0 rgba(23,21,31,.04),0 10px 30px -18px rgba(23,21,31,.28);
  --float:0 0 0 1px rgba(23,21,31,.07),0 28px 70px -24px rgba(23,21,31,.42),0 8px 18px -10px rgba(23,21,31,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--ui);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--iris);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
svg{display:block}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:20px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:8px}
.brand b{font-family:var(--display);font-weight:650;font-size:20px;letter-spacing:-.02em}
.seg{position:relative;display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:var(--surface);box-shadow:0 1px 2px rgba(23,21,31,.08),0 0 0 1px rgba(23,21,31,.06);transition:transform .38s var(--ease),width .38s var(--ease);pointer-events:none}
.seg button{position:relative;z-index:1;padding:7px 11px;border-radius:9px;color:var(--ink-2);display:flex;align-items:center;gap:8px;white-space:nowrap;transition:color .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{color:var(--ink);font-weight:600}
.seg button .k{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;border:1px solid var(--line-2);border-radius:5px;padding:0 5px;line-height:16px}
.seg button.on .k{border-color:var(--iris-line);color:var(--iris)}
#scenSeg .thumb{background:var(--iris);box-shadow:0 1px 2px rgba(79,47,230,.35),0 6px 16px -8px rgba(79,47,230,.7)}
#scenSeg button.on{color:#fff}
#scenSeg button.on .k{border-color:rgba(255,255,255,.45);color:#fff}
.seg .sep{width:1px;align-self:stretch;margin:5px 6px;background:var(--line-2)}
.spacer{flex:1}
.reset{color:var(--ink-2);padding:8px 10px;border-radius:9px}
.reset:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- layout ---------- */
main{flex:1;display:flex;padding:18px 20px 20px;min-height:0;min-width:0}
#paneShop{flex:0 1 var(--split,52%);min-width:340px}
#paneBiz{flex:1 1 0;min-width:340px}
.divider{flex:none;width:18px;cursor:col-resize;display:flex;align-items:center;justify-content:center;touch-action:none;border-radius:8px}
.divider::before{content:"";width:4px;height:44px;border-radius:2px;background:var(--line-2);transition:background .2s,height .3s var(--ease)}
.divider:hover::before,.divider.drag::before,.divider:focus-visible::before{background:var(--iris);height:80px}
.divider:focus-visible{outline:none}
body.resizing{cursor:col-resize;user-select:none}
body.resizing .page,body.resizing .console{pointer-events:none}
main.v-shopper #paneBiz,main.v-shopper .divider,main.v-business #paneShop,main.v-business .divider{display:none}
main.v-shopper #paneShop,main.v-business #paneBiz{flex:1 1 auto}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;min-width:0;white-space:nowrap}
.pane-h h2{margin:0;font-size:15px;font-weight:600}
.pane-h span{color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- browser ---------- */
.browser{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--lift);border:1px solid var(--line);overflow:hidden;container:shop/inline-size}
.chrome{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.lights{display:flex;gap:6px}.lights i{width:10px;height:10px;border-radius:50%;background:#D9DBE1}
.navs{display:flex;gap:6px;color:#B3B5BE}
.url{flex:1;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--ink-2);min-width:0}
.url .host{color:var(--ink);font-weight:500;flex:0 1 auto;min-width:0}
#urlText>span+span{flex:0 1000 auto;min-width:0}
#urlText{display:flex;min-width:0;overflow:hidden}
.url span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.extbtn{position:relative;width:32px;height:30px;border-radius:8px;display:grid;place-items:center}
.extbtn:hover{background:var(--surface)}
.extbtn .dot{position:absolute;right:3px;top:3px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface-2);transform:scale(0);transition:transform .35s var(--spring)}
.extbtn .dot.on{transform:scale(1)}
.page{flex:1;overflow:auto;position:relative}

/* merchant site */
.site{min-height:100%;display:flex;flex-direction:column;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0}}
.m-nav{display:flex;align-items:center;gap:22px;padding:16px 26px;color:#fff}
.m-nav .logo{font-size:17px;font-weight:700;letter-spacing:-.01em}
.m-nav .links{margin-left:auto;display:flex;gap:18px;font-size:13px;opacity:.8}
.m-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;padding:24px 26px 30px}
.prod .art{aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;margin-bottom:16px}
.prod h4{margin:0;font-size:18px;letter-spacing:-.01em}
.prod .variant{color:var(--ink-3);margin-top:2px}
.prod p{color:var(--ink-2);margin:10px 0 0;font-size:13px;max-width:44ch}
.co{border:1px solid var(--line);border-radius:12px;padding:18px;align-self:start;background:var(--surface)}
.co h5{margin:0 0 10px;font-size:13px;font-weight:600}
.co .line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);padding:3px 0}
.co .total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:600}
.co .total b{font-size:18px;font-weight:650;letter-spacing:-.01em}
.methods{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.method{display:grid;grid-template-columns:18px 26px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-3)}
.method .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2)}
.method b{display:block;color:var(--ink-2);font-weight:600}
.method small{display:block;font-size:12px}
.method.on{border-color:var(--ink);color:var(--ink-2);box-shadow:0 0 0 1px var(--ink)}
.method.on b{color:var(--ink)}
.method.on .radio{border:5px solid var(--ink)}
.wallets{margin:8px 0 2px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wallets .wh{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.wallet{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;font-size:13px;opacity:.5}
.wallet+.wallet{border-top:1px solid var(--line)}
.wallet.on{opacity:1}
.wallet .ico{width:28px;height:28px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.wallet b{display:block;font-weight:600}
.wallet>span{min-width:0}
.wallet b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet small{display:flex;gap:6px;min-width:0;color:var(--ink-3);font-size:12px;white-space:nowrap}
.wallet small .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.wallet small .mono{flex:none}
.wallet .bal{text-align:right;font-size:12px;color:var(--ink-2);white-space:nowrap}
.paybtn{width:100%;margin-top:14px;border-radius:10px;padding:12px 14px;color:#fff;font-weight:600;font-size:14px;transition:transform .15s var(--ease),opacity .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.paybtn:active{transform:scale(.985)}
.paybtn:disabled{cursor:default}
.paybtn.busy{opacity:.85}
.paybtn.done{opacity:.55}
.guard{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--ink-3);margin-top:10px}
.mstatus{margin-top:12px;font-size:13px;border-radius:10px;padding:10px 12px;display:none;animation:rise .35s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}

/* clone site */
.scam{background:#0B3D2E;color:#fff;padding:22px 26px 26px}
.scam .logo{font-weight:700;font-size:17px}
.scam h3{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:22px 0 8px;font-weight:700;max-width:18ch}
.scam p{margin:0;opacity:.85;font-size:13px}
.scam .badges{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;font-size:12px}
.scam .badges span{background:rgba(255,255,255,.12);border-radius:6px;padding:4px 8px}

/* ---------- extension sheet ---------- */
.ext{position:absolute;top:50px;right:12px;width:min(372px,calc(100% - 24px));max-height:calc(100% - 62px);overflow:auto;scrollbar-gutter:stable;background:var(--surface);border-radius:16px;box-shadow:var(--float);z-index:5;transform-origin:top right;display:none}
.ext.open{display:block;animation:sheet .32s var(--ease)}
@keyframes sheet{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.ext-h{display:flex;align-items:center;gap:9px;padding:14px 16px 12px}
.ext-h b{font-family:var(--display);font-weight:650;font-size:16px;letter-spacing:-.01em}
.ext-h small{margin-left:auto;color:var(--ink-3);font-size:12px}
.ext-pay{margin:0 16px;padding:12px 14px;border-radius:12px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.ext-pay b{font-size:20px;font-weight:650;letter-spacing:-.02em}
.ext-pay small{display:block;color:var(--ink-3);font-size:12px}
.rail{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.rail.cbdc{color:var(--iris);border-color:var(--iris-line);background:var(--iris-tint)}
.checks{list-style:none;margin:10px 0 0;padding:0 16px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0}
.checks li+li{border-top:1px solid var(--line)}
.sk{color:transparent;border-radius:4px;background:linear-gradient(90deg,#ECEEF3 0%,#F7F8FA 50%,#ECEEF3 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:color .35s var(--ease),background-color .35s}
.sk.done{color:inherit;background:none;animation:none}
@keyframes shimmer{to{background-position:-200% 0}}
.checks .t{font-weight:600;font-size:13px}
.checks .d{color:var(--ink-3);font-size:12px;line-height:1.4;margin-top:1px}
.ic{width:20px;height:20px;min-width:20px;flex:none;border-radius:50%;display:grid;place-items:center;margin-top:1px;overflow:hidden}
.ic.pending{color:var(--iris)}
.spin{width:14px;height:14px;flex:none;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ic.pass{background:var(--ok-tint);color:var(--ok)}
.ic.fail{background:var(--deny-tint);color:var(--deny)}
.ic.warn{background:var(--hold-tint);color:var(--hold)}
.ic.na{background:var(--surface-2);color:var(--ink-3)}
.ic.inherit{background:var(--iris-tint);color:var(--iris)}
.ic svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s .05s var(--ease) forwards}
.verdict{margin:12px 16px 16px;border-radius:14px;padding:16px;display:none}
.verdict.show{display:block;animation:rise .4s var(--ease)}
.verdict .vh{display:flex;align-items:center;gap:10px}
.verdict h3{margin:0;font-family:var(--display);font-size:19px;font-weight:650;letter-spacing:-.015em}
.verdict p{margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.verdict.ok{background:var(--ok-tint)}.verdict.ok h3{color:var(--ok)}
.verdict.hold{background:var(--hold-tint)}.verdict.hold h3{color:var(--hold)}
.verdict.deny{background:var(--deny-tint)}.verdict.deny h3{color:var(--deny)}
.verdict.neutral{background:var(--surface-2)}.verdict.neutral h3{color:var(--ink)}
.verdict ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.verdict li{margin:3px 0}
.escrow{display:flex;gap:10px;align-items:flex-start;margin-top:12px;background:rgba(255,255,255,.65);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.escrow svg{flex:none;margin-top:1px}
.ask{margin-top:14px}
.ask b{display:block;font-size:13px;margin-bottom:8px}
.ask button{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid rgba(23,21,31,.08);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:6px;transition:border-color .2s,transform .15s var(--ease)}
.ask button:hover{border-color:var(--ink)}
.ask button:active{transform:scale(.99)}
.answered{margin-top:12px;font-size:13px;background:rgba(255,255,255,.65);border-radius:10px;padding:10px 12px;animation:rise .35s var(--ease)}

/* seal: the shared decision mark */
.seal{flex:none}
.seal{animation:sealIn .4s var(--spring) both}
@keyframes sealIn{from{opacity:0;transform:scale(.6)}}
.seal .glyph{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .4s .15s var(--ease) forwards}
.seal.still,.seal.still .glyph{animation:none;stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- console ---------- */
.console{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--lift);overflow:hidden;container:biz/inline-size}
.c-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:14px 18px 0}
.c-head b{font-family:var(--display);font-weight:650;font-size:17px;letter-spacing:-.015em}
.nw{width:26px;height:26px;border-radius:7px;background:#0E3B5C;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em}
.c-head .by{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);padding-left:10px;margin-left:2px;border-left:1px solid var(--line-2)}
.c-head .who{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;gap:14px;align-items:center}
.c-head .who strong{color:var(--ink-2);font-weight:600}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.tabs{position:relative;display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;flex:none;padding:9px 8px 11px;color:var(--ink-3);display:flex;gap:7px;align-items:center;transition:color .2s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs .bar{position:absolute;bottom:-1px;left:0;height:2px;background:var(--iris);border-radius:2px;transition:transform .38s var(--ease),width .38s var(--ease)}
.count{min-width:18px;height:18px;border-radius:9px;background:var(--hold);color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.count.on{display:inline-grid;animation:pop .4s var(--spring)}
@keyframes pop{from{transform:scale(.4)}}
.tab{flex:1;overflow:auto;padding:16px 18px 24px;display:none}
.tab.on{display:block}
.blank{padding:56px 12px;text-align:center;color:var(--ink-3);max-width:380px;margin:0 auto}
.blank b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

/* review card */
.rcard{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;background:var(--surface)}
.rcard.enter{animation:enter .55s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.rc-top{display:flex;gap:12px;align-items:center;padding:14px 16px}
.rc-top>div:not(.clock){min-width:0;flex:1}
.rc-top h4{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.rc-top small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.clock{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-3)}
.clock b{display:block;font-size:16px;color:var(--hold);font-weight:650;font-variant-numeric:tabular-nums}
.rc-sec{padding:12px 16px;border-top:1px solid var(--line)}
.rc-sec h5{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--ink-3)}
.why{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:13px}
.why+.why{margin-top:8px}
.rid{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums;margin-top:1px}
.why small{display:block;color:var(--ink-3);font-size:12px;margin-top:3px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.answer{border-radius:12px;padding:12px 14px;font-size:13px}
.answer b{display:block;font-size:14px;margin-bottom:2px}
.answer.wait{background:var(--surface-2);color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.answer.wait b{font-size:13px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--hold);margin-top:6px;flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.answer.self{background:var(--ok-tint)} .answer.self b{color:var(--ok)}
.answer.coached{background:var(--deny-tint)} .answer.coached b{color:var(--deny)}
.answer .rec{margin-top:6px;color:var(--ink-2)}
.told{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.acts{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.btn{border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;transition:transform .15s var(--ease),background .2s,opacity .2s;border:1px solid transparent}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:#2A2735}
.btn.brand{background:var(--iris);color:#fff}
.btn.brand:hover:not(:disabled){background:var(--iris-2)}
.btn.quiet{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.quiet:hover{border-color:var(--ink-3)}
.btn.danger{background:var(--surface);border-color:var(--line-2);color:var(--deny)}
.btn.danger:hover{border-color:var(--deny)}
.liab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.liab.open{grid-template-rows:1fr}
.liab>div{overflow:hidden}
.liab-in{margin:0 16px 14px;padding:16px;border-radius:12px;background:var(--ink);color:#EDEBF5}
.liab-in h6{margin:0 0 6px;font-family:var(--display);font-size:17px;font-weight:650;letter-spacing:-.01em;color:#fff}
.liab-in p{margin:0 0 8px;font-size:13px;color:#C9C6D6}
.liab-in .warnline{color:#FFB4AB}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#fff;margin:12px 0 14px;cursor:pointer}
.agree input{appearance:none;width:18px;height:18px;border-radius:5px;border:1.5px solid #8F8BA3;margin:1px 0 0;flex:none;display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.agree input:checked{background:#fff;border-color:#fff}
.agree input:checked::after{content:"";width:9px;height:5px;border:2px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.liab-in .row{display:flex;gap:8px;justify-content:flex-end}
.liab-in .btn.quiet{background:transparent;color:#fff;border-color:#4A4659}
.liab-in .btn.white{background:#fff;color:var(--ink)}

/* decision rows */
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 2px;border-bottom:1px solid var(--line)}
.drow.enter{animation:enter .55s var(--ease)}
.drow h4{margin:0;font-size:14px;font-weight:600}
.drow .meta{color:var(--ink-3);font-size:12px;margin-top:1px}
.drow .body{font-size:13px;color:var(--ink-2);margin-top:8px}
.drow .body p{margin:4px 0}
.drow .when{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.st{font-weight:600}.st.ok{color:var(--ok)}.st.hold{color:var(--hold)}.st.deny{color:var(--deny)}
.liabnote{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin-top:6px}

/* rules */
.intro{font-size:13px;color:var(--ink-2);margin:0 0 14px;max-width:62ch}
.rule{padding:14px 0;border-bottom:1px solid var(--line)}
.rule .rh{display:flex;gap:10px;align-items:center}
.rule .rh b{font-size:14px}
.rule .out{margin-left:auto;font-size:12px;font-weight:600}
.out.DENY{color:var(--deny)}.out.HOLD{color:var(--hold)}.out.INHERIT{color:var(--iris)}
.rule .cond{font-size:13px;color:var(--ink-2);margin-top:6px;max-width:66ch}
.rule .src{font-size:12px;color:var(--ink-3);margin-top:4px}
.edit{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-2)}
.edit input{width:86px;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;font:inherit;font-variant-numeric:tabular-nums}
.proposal{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;animation:rise .35s var(--ease)}
.proposal h5{margin:0;font-size:14px}
.proposal .sub{font-size:13px;color:var(--ink-2);margin-top:4px}
.bars{display:grid;grid-template-columns:80px 1fr 64px;gap:8px;align-items:center;margin:12px 0 8px;font-size:13px}
.track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--iris);border-radius:4px;transition:width .6s var(--ease)}
.track i.now{background:var(--ink-3)}

/* audit */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar span{font-size:12px;color:var(--ink-3);flex-basis:100%}
.vres{border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;animation:rise .35s var(--ease)}
.vres.good{background:var(--ok-tint);color:var(--ok)}.vres.bad{background:var(--deny-tint);color:var(--deny)}
.ae{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.ae.broken{background:var(--deny-tint);border-radius:8px;padding:10px 8px}
.ae .seq{color:var(--ink-3);font-variant-numeric:tabular-nums}
.ae .ev{font-weight:600}
.ae .who{color:var(--ink-3);font-size:12px}
.ae .det{color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.ae .hash{color:var(--ink-3);margin-top:3px}

/* api */
.call{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.call .ch{display:flex;gap:10px;align-items:center;padding:8px 12px;font-size:13px;background:var(--surface-2)}
.call .m{font-weight:700}
.call .code{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.call pre{margin:0;padding:10px 12px;font:12px/1.5 var(--mono);max-height:200px;overflow:auto;background:#17151F;color:#DCD9EA;white-space:pre-wrap;word-break:break-word}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:var(--float);opacity:0;transition:opacity .25s var(--ease),transform .35s var(--ease);pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@container shop (max-width:720px){.m-body{grid-template-columns:minmax(0,1fr);gap:18px}.prod .art{aspect-ratio:auto;height:180px}.co{max-width:460px}}
@container shop (max-width:520px){.m-nav .links{display:none}.m-nav,.scam{padding-left:18px;padding-right:18px}.m-body{padding:18px}.scam h3{font-size:23px}.ext{left:12px;width:auto}}
@container biz (max-width:600px){.kv{grid-template-columns:minmax(0,1fr);gap:0}.kv dd{margin-bottom:8px}.c-head .who>span:first-child{display:none}.drow{grid-template-columns:auto minmax(0,1fr)}.drow .when{grid-column:2;text-align:left}.rc-top{flex-wrap:wrap}.acts .btn{flex:1}.liab-in .row .btn{flex:1}}
@container biz (max-width:460px){.c-head .by{border-left:0;padding-left:0;margin-left:0;flex-basis:100%;order:3}.c-head .who{margin-left:0;width:100%;order:4}.tabs{gap:0;padding:8px 8px 0}.tabs button{padding:9px 7px 11px}.clock{flex-basis:100%;margin-left:44px;text-align:left;display:flex;gap:6px;align-items:baseline}.clock b{display:inline;font-size:14px}.rc-sec,.rc-top{padding-left:14px;padding-right:14px}}
@media (max-width:900px){main{flex-direction:column;gap:18px}#paneShop,#paneBiz{flex:none;min-width:0}.divider{display:none}.browser{min-height:760px}.console{min-height:640px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

<script>
{
/* ---------- setup ---------- */
const qs = new URLSearchParams(location.search);
const ROOM = (qs.get('room') || 'demo').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40) || 'demo';

const short = w => String(w).startsWith('0x') ? w.slice(0, 6) + '…' + w.slice(-4) : w;

const time = ts => new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

const MARK = (size = 22, a = '#4F2FE6', b = '#17151F') => `<svg width="${size}" height="${Math.round(size * .62)}" viewBox="0 0 48 30" aria-hidden="true"><path d="M3 15l8 8L27 5" fill="none" stroke="${a}" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 15l8 8L45 3" fill="none" stroke="${b}" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  crypto: '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 2l5.5 3.2v6.6L9 15l-5.5-3.2V5.2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 2v13M3.5 5.2L9 8.4l5.5-3.2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round" opacity=".6"/></svg>',

const ART = {

  bowl: c => `<svg width="140" height="110" viewBox="0 0 140 110"><ellipse cx="70" cy="78" rx="54" ry="12" fill="${c}" opacity=".35"/><ellipse cx="70" cy="70" rx="50" ry="11" fill="${c}" opacity=".6"/><path d="M34 42h72c0 20-16 32-36 32S34 62 34 42z" fill="${c}"/><ellipse cx="70" cy="42" rx="36" ry="8" fill="#fff" opacity=".55"/></svg>`,
  laptop: c => `<svg width="160" height="110" viewBox="0 0 160 110"><rect x="32" y="16" width="96" height="64" rx="6" fill="${c}"/><rect x="38" y="22" width="84" height="52" rx="3" fill="#fff" opacity=".12"/><path d="M18 86h124l-8 10H26z" fill="${c}" opacity=".8"/></svg>`,
  headphones: c => `<svg width="130" height="120" viewBox="0 0 130 120"><path d="M30 72V60a35 35 0 0170 0v12" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/><rect x="20" y="62" width="22" height="38" rx="10" fill="${c}"/><rect x="88" y="62" width="22" height="38" rx="10" fill="${c}"/></svg>`,
  bond: c => `<svg width="150" height="110" viewBox="0 0 150 110"><rect x="22" y="14" width="106" height="80" rx="4" fill="#fff"/><rect x="22" y="14" width="106" height="80" rx="4" fill="none" stroke="${c}" stroke-width="3"/><path d="M38 34h60M38 46h74M38 58h50" stroke="${c}" stroke-width="3" stroke-linecap="round" opacity=".6"/><circle cx="106" cy="74" r="12" fill="${c}"/></svg>`
};
const EVENT = { LEDGER_INIT: 'Ledger started', PAYMENT_INITIATED: 'Payment started', DECISION: 'Decision', ESCROW_LOCKED: 'Funds locked in escrow',
  CUSTOMER_RESPONSE: 'Customer answered', REVIEW_DECISION: 'Reviewed', LIABILITY_ACCEPTED: 'Liability accepted', ESCROW_RELEASED: 'Escrow released',
  ESCROW_REFUNDED: 'Escrow refunded', RULE_CHANGE_PROPOSED: 'Rule change proposed', RULE_CHANGE_APPROVED: 'Rule change approved', RULE_CHANGE_DISCARDED: 'Rule change discarded' };
const KIND = { APPROVE: 'ok', HOLD: 'hold', DENY: 'deny' };

let SC = {}, B = null, lastRev = -1, cur = null, animating = false, verifyRes = null;
const calls = [], seen = new Set(), liab = {}, liabOk = {};

/* ---------- built in engine, used when the page is opened without the Flask server. Mirrors app.py ---------- */
const LOCAL = (() => {
  const SHA = (() => {
    const primes = n => { const p = []; for (let i = 2; p.length < n; i++) if (p.every(q => i % q)) p.push(i); return p; };
    const frac = x => Math.floor((x - Math.floor(x)) * 2 ** 32) >>> 0;
    const K = primes(64).map(p => frac(Math.cbrt(p))), H0 = primes(8).map(p => frac(Math.sqrt(p)));
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    return str => {
      const bytes = new TextEncoder().encode(str), l = bytes.length, total = Math.ceil((l + 9) / 64) * 64;
      const m = new Uint8Array(total); m.set(bytes); m[l] = 0x80;
      const dv = new DataView(m.buffer); dv.setUint32(total - 8, Math.floor(l * 8 / 2 ** 32)); dv.setUint32(total - 4, (l * 8) >>> 0);
      let H = H0.slice(); const w = new Uint32Array(64);
      for (let i = 0; i < total; i += 64) {
        for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
        for (let t = 16; t < 64; t++) w[t] = (w[t-16] + (rotr(w[t-15],7) ^ rotr(w[t-15],18) ^ (w[t-15] >>> 3)) + w[t-7] + (rotr(w[t-2],17) ^ rotr(w[t-2],19) ^ (w[t-2] >>> 10))) >>> 0;
        let [a, b, c, d, e, f, g, h] = H;
        for (let t = 0; t < 64; t++) {
          const t1 = (h + (rotr(e,6) ^ rotr(e,11) ^ rotr(e,25)) + ((e & f) ^ (~e & g)) + K[t] + w[t]) >>> 0;
          const t2 = ((rotr(a,2) ^ rotr(a,13) ^ rotr(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        H = [a, b, c, d, e, f, g, h].map((v, k) => (H[k] + v) >>> 0);
      }
      return H.map(x => x.toString(16).padStart(8, '0')).join('');
    };
  })();
  const REVIEWER = 'A. Patel', SECOND = 'J. Okafor';

function setDot(kind) {
  const d = $('extDot');
  if (!kind) { d.classList.remove('on'); return; }
  d.style.background = COLOR[kind]; d.classList.add('on');
}
function closeExt() { const e = $('ext'); e.classList.remove('open'); e.innerHTML = ''; }

async function startPayment() {
  const sc = SC[cur.key], btn = $('payBtn');
  btn.disabled = true; btn.classList.add('busy');
  btn.innerHTML = `${SPIN}${sc.rail === 'cbdc' ? 'Confirming with your bank' : 'Waiting for your wallet'}`;
  animating = true;
  let tx;
  try { await sleep(500); tx = await api('POST', '/api/payments', { scenario: cur.key }); }
  catch (e) { animating = false; btn.disabled = false; btn.classList.remove('busy'); btn.textContent = 'Try again'; toast('Couldn’t reach Countersign. ' + e.message); return; }
  cur.tx = tx;
  const ext = $('ext');
  ext.innerHTML = `<div class="ext-h">${MARK(22)}<b>Countersign</b><small>Checking before you pay</small></div>
    <div class="ext-pay"><span><b class="num">${money(tx.amount)}</b><small>to ${esc(sc.merchant.name)}</small></span><span class="rail${tx.rail === 'cbdc' ? ' cbdc' : ''}">${tx.rail === 'cbdc' ? 'Digital pound' : 'Crypto, GBPx'}</span></div>
    <ul class="checks" id="checks"></ul><div class="verdict" id="verdict"></div>`;
  ext.classList.add('open');
  const ul = $('checks');
  ul.innerHTML = tx.checks.map(c => `<li><span class="ic pending">${SPIN}</span><div><div class="t">${esc(c.t)}</div><div class="d"><span class="sk">${esc(c.d)}</span></div></div></li>`).join('');
  const rows = [...ul.children];
  for (let i = 0; i < rows.length; i++) {
    await sleep(i ? 380 : 260);
    const c = tx.checks[i], ic = rows[i].querySelector('.ic');
    ic.className = 'ic ' + c.s; ic.innerHTML = ICON[c.s];
    rows[i].querySelector('.sk').classList.add('done');
  }
  await sleep(200);
  renderShopper(tx, true);
  animating = false;
  await refresh(true);
  switchTab(tx.status === 'HOLD' ? 'queue' : 'decisions');
}

function renderShopper(tx, fresh = false) {
  const v = $('verdict'), ms = $('mstatus'), btn = $('payBtn');
  if (!v) return;
  const name = esc(tx.merchant), msg = tx.messages.map(esc).join(' '), amt = money(tx.amount);
  const asset = tx.rail === 'cbdc' ? '' : ' GBPx';
  let kind, html, status, btnTxt;
  if (tx.status === 'APPROVE' && tx.reviewed) {
    kind = 'ok'; btnTxt = 'Paid'; status = `Order confirmed, ${esc(tx.id)}`;
    html = `<h3>Payment sent</h3></div><p>Thanks for waiting. Your payment to ${name} was checked and released from escrow.</p>`;
  } else if (tx.status === 'APPROVE') {
    kind = 'ok'; btnTxt = 'Paid'; status = `Order confirmed, ${esc(tx.id)}`;
    html = `<h3>Safe to pay</h3></div><p>${name} is a verified merchant and nothing unusual was found. Your ${amt}${asset} has been sent.</p>`;
  } else if (tx.status === 'DENY' && tx.reviewed) {
    kind = 'deny'; btnTxt = 'Cancelled'; status = 'Payment cancelled. Your money is back in your wallet.';
    html = `<h3>Payment cancelled</h3></div><p>We couldn’t confirm this payment was safe, so it was cancelled and your ${amt}${asset} was returned.</p>
      <p>If someone asked you to make this payment, talk to your bank or wallet provider.</p>`;
  } else if (tx.status === 'DENY' && tx.sensitive) {
    kind = 'neutral'; btnTxt = 'Not completed'; status = 'Payment could not be completed.';
    html = `<h3>Payment not completed</h3></div><p>${msg}</p><p>No money has left your wallet.</p>`;
  } else if (tx.status === 'DENY') {
    kind = 'deny'; btnTxt = 'Stopped'; status = 'Payment stopped by Countersign. No money has left your wallet.';
    html = `<h3>Don’t pay this site</h3></div><p>${msg}</p>
      <ul><li>Find the real firm on the FCA Register and contact them directly.</li><li>If you’ve already paid or shared details, call your bank now.</li></ul>`;
  } else {
    kind = 'hold'; btnTxt = 'Waiting for a check'; status = `Payment waiting for a quick check, ${esc(tx.id)}`;
    const asked = tx.feedback === 'self' ? `<div class="answered">Thanks. We’ve told the reviewer you’re making this payment yourself.</div>`
      : tx.feedback === 'coached' ? `<div class="answered">Thank you for telling us. Scammers often push people to pay quickly. Your money stays in escrow and a specialist will call you.</div>`
      : `<div class="ask" id="ask"><b>Did anyone ask you to make this payment?</b><button data-f="self">No, I’m buying this myself</button><button data-f="coached">Yes, someone told me to pay or move my money</button></div>`;
    html = `<h3>Payment on hold</h3></div><p>${msg}</p>
      <div class="escrow">${WICON.lock}<span>Your ${amt}${asset} is held in escrow, not sent. You’ll have an answer within 15 minutes.</span></div>${asked}`;
  }
  const sameKind = v.dataset.kind === kind;
  v.className = 'verdict show ' + kind; v.dataset.kind = kind;
  v.innerHTML = `<div class="vh">${seal(kind, 26, sameKind && !fresh)}${html}`;
  ms.style.display = 'block'; ms.style.background = `var(--${kind === 'ok' ? 'ok' : kind === 'hold' ? 'hold' : kind === 'deny' ? 'deny' : 'surface-2'}${kind === 'neutral' ? '' : '-tint'})`;
  ms.style.color = kind === 'neutral' ? 'var(--ink-2)' : COLOR[kind]; ms.textContent = status;
  btn.disabled = true; btn.classList.remove('busy'); btn.classList.add('done'); btn.textContent = btnTxt; setDot(kind);
  $('ask')?.querySelectorAll('button').forEach(b => b.onclick = () => sendFeedback(tx.id, b.dataset.f));
}

async function sendFeedback(id, f) {
  try {
    const tx = await api('POST', `/api/payments/${id}/feedback`, { feedback: f });
    cur.tx = tx; renderShopper(tx); await refresh(true);
  } catch (e) { toast(e.message); }
}

/* ---------- business side ---------- */
async function review(id, approve) {
  try {
    await api('POST', `/api/payments/${id}/review`, { approve, accept_liability: approve ? !!liabOk[id] : undefined });
    delete liab[id]; delete liabOk[id];
    await refresh(true); await syncShopper();
    toast(approve ? `${id} approved. Funds released and liability recorded.` : `${id} denied. Funds returned to the payer.`);
  } catch (e) { toast(e.message); }
}

const why = f => `<div class="why"><span class="rid">${esc(f.id)}</span><span>${esc(f.business)}<small>${esc(f.internal)}</small></span></div>`;
const payerType = p => p.type === 'bank' ? `Digital pound wallet at ${esc(p.provider)}` : p.type === 'exchange' ? `Exchange account at ${esc(p.name)}` : 'Self custody wallet';

function answerBlock(tx) {
  if (tx.feedback === 'coached') return `<div class="answer coached"><b>Someone asked them to make this payment</b>
    The customer told us another person asked them to pay or move their money.<div class="rec">This is the most common sign of a scam. Countersign recommends you deny and refund.</div></div>`;
  if (tx.feedback === 'self') return `<div class="answer self"><b>They’re making this payment themselves</b>
    The customer says nobody asked them to pay.<div class="rec">This lowers the scam risk but doesn’t rule out account takeover. Check the wallet history before releasing.</div></div>`;
  return `<div class="answer wait"><span class="pulse"></span><span><b>Waiting for the customer</b>They’ve been asked whether anyone told them to make this payment. Their answer shows here as soon as they reply.</span></div>`;
}

  el.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { const id = b.dataset.cancel; delete liab[id]; delete liabOk[id]; const card = b.closest('.rcard'); card.querySelector('.liab').classList.remove('open'); card.querySelector('[data-approve]').disabled = false; card.querySelector('[data-agree]').checked = false; card.querySelector('[data-confirm]').disabled = true; });

function tick() {
  document.querySelectorAll('[data-due]').forEach(el => {
    const left = Math.max(0, 900 - Math.floor((Date.now() - new Date(el.dataset.due)) / 1000));
    el.textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
  });
  document.querySelectorAll('[data-ago]').forEach(el => el.textContent = ago(el.dataset.ago));
}

/* ---------- sync ---------- */
async function refresh(force) {
  try {
    const st = await api('GET', '/api/state', null, false);
    if (force || st.rev !== lastRev) {
      B = st; lastRev = st.rev;
      if (!animating) {
        const a = document.activeElement;
        if (a && a.tagName === 'INPUT' && a.type === 'number') { renderQueue(); renderDecisions(); renderAudit(); $('rsVer').textContent = B.ruleset; }
        else renderAll();
      }
    }
  } catch (e) { /* the next poll tries again */ }
}

async function syncShopper() {
  if (!cur || !cur.tx || animating || cur.tx.status !== 'HOLD') return;
  try {
    const tx = await api('GET', `/api/payments/${cur.tx.id}`, null, false);
    if (tx.status !== cur.tx.status || tx.feedback !== cur.tx.feedback) { const changed = tx.status !== cur.tx.status; cur.tx = tx; renderShopper(tx, changed); }
  } catch (e) { /* ignore */ }
}

/* ---------- plumbing ---------- */
function switchTab(t) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.id === 'tab-' + t));
  moveBar();
}
function setView(v) {
  VIEW = v; $('main').className = v === 'split' ? '' : 'v-' + v;
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); moveThumb($('viewSeg'));
  const u = new URL(location.href); u.searchParams.set('view', v); if (ROOM !== 'demo') u.searchParams.set('room', ROOM);
  try { history.replaceState(null, '', u); } catch (e) { /* not allowed for file:// pages */ }
  requestAnimationFrame(() => { moveBar(); moveThumb($('scenSeg')); });
}
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

async function reset() {
  if (animating) return;
  B = await api('POST', '/api/reset'); lastRev = B.rev; verifyRes = null; cur = null; seen.clear();
  renderAll(); switchTab('queue'); loadScenario('s1', true); toast('Demo reset');
}

$('markTop').innerHTML = MARK(30); $('markExt').innerHTML = MARK(20); $('markConsole').innerHTML = MARK(16);
document.querySelectorAll('#scenSeg button').forEach(b => b.onclick = () => choose(b.dataset.s));
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => switchTab(b.dataset.t));
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => setView(b.dataset.v));
$('resetBtn').onclick = reset;
$('extBtn').onclick = () => { const e = $('ext'); if (e.innerHTML) e.classList.toggle('open'); };
$('copyLink').onclick = async () => {
  if (MODE === 'local') { toast('The reviewer link needs the Flask server running'); return; }
  const u = new URL(location.origin + location.pathname); u.searchParams.set('room', ROOM); u.searchParams.set('view', 'business');
  try { await navigator.clipboard.writeText(u.toString()); toast('Reviewer link copied. Open it on a second device.'); } catch (e) { toast(u.toString()); }
};
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || e.metaKey || e.ctrlKey) return;
  if (['1', '2', '3', '4'].includes(e.key)) choose('s' + e.key);
  if (e.key.toLowerCase() === 'r') reset();
});
window.addEventListener('resize', () => { moveThumb($('scenSeg')); moveThumb($('viewSeg')); moveBar(); });
/* draggable split between the shopper and business panels */
{
  const main = $('main'), dv = $('divider');
  const setSplit = (p, save) => {
    p = Math.min(75, Math.max(25, p)); main.style.setProperty('--split', p + '%'); dv.setAttribute('aria-valuenow', Math.round(p));
    if (save) try { localStorage.setItem('cs-split', p); } catch (e) { /* storage blocked */ }
  };
  try { const v = parseFloat(localStorage.getItem('cs-split')); if (v) setSplit(v); } catch (e) { /* storage blocked */ }
  dv.addEventListener('pointerdown', e => { dv.setPointerCapture(e.pointerId); dv.classList.add('drag'); document.body.classList.add('resizing'); e.preventDefault(); });
  dv.addEventListener('pointermove', e => {
    if (!dv.classList.contains('drag')) return;
    const r = main.getBoundingClientRect(), padL = parseFloat(getComputedStyle(main).paddingLeft), padR = parseFloat(getComputedStyle(main).paddingRight);
    setSplit((e.clientX - r.left - padL - dv.offsetWidth / 2) / (r.width - padL - padR - dv.offsetWidth) * 100);
  });
  const stop = () => { if (!dv.classList.contains('drag')) return; dv.classList.remove('drag'); document.body.classList.remove('resizing'); setSplit(parseFloat(dv.getAttribute('aria-valuenow')), true); };
  dv.addEventListener('pointerup', stop); dv.addEventListener('pointercancel', stop);
  dv.addEventListener('dblclick', () => setSplit(52, true));
  dv.addEventListener('keydown', e => {
    const now = parseFloat(dv.getAttribute('aria-valuenow'));
    if (e.key === 'ArrowLeft') { setSplit(now - 2, true); e.preventDefault(); }
    if (e.key === 'ArrowRight') { setSplit(now + 2, true); e.preventDefault(); }
  });
  if (window.ResizeObserver) new ResizeObserver(() => moveBar()).observe(document.querySelector('.console'));
}

(async () => {
  try {
    if (location.protocol === 'file:') throw new Error('file');
    SC = await api('GET', '/api/scenarios', null, false);
    if (!SC || !SC.s1) throw new Error('bad response');
  } catch (e) { MODE = 'local'; SC = await api('GET', '/api/scenarios', null, false); }
  setView(VIEW); renderApi();
  await refresh(true);
  await choose('s1', true);
  document.fonts?.ready.then(() => { moveThumb($('scenSeg')); moveThumb($('viewSeg')); moveBar(); });
  setInterval(() => { refresh(false); syncShopper(); }, 1500);
  setInterval(tick, 1000);
})();
}
